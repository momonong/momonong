<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img" aria-labelledby="title description">
  <title id="title">Morris Jhennong Chen — Building practical solutions to real-world problems.</title>
  <desc id="description">AI, Software Engineering, System Design. Understand the problem, design the system, build the solution.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101e2c"/><stop offset="1" stop-color="#172c35"/></linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#a4c8c8" opacity=".09"/></pattern>
  </defs>
  <style>
    text { font-family: 'Segoe UI', Arial, sans-serif; }
    .headline { font-size: 43px; font-weight: 700; letter-spacing: -1.2px; fill: #f1f5f7; }
    .accent { fill: #8bdecf; }
    .route { fill: none; stroke: #355760; stroke-width: 1.5; }
    .signal { fill: none; stroke: #8bdecf; stroke-width: 2; stroke-dasharray: 5 27; animation: travel 9s linear infinite; opacity: .7; }
    .pill rect, .node { fill: #152b34; stroke: #3f656d; stroke-width: 1.5; }
    .node path, .node rect { fill: none; stroke: #8bdecf; stroke-width: 1.7; }
    .step { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; letter-spacing: 1px; fill: #b9d2d5; }
    @keyframes travel { to { stroke-dashoffset: -128; } }
    @media (prefers-reduced-motion: reduce) { .signal { animation: none; } }
  </style>
  <rect width="1000" height="380" rx="18" fill="url(#background)"/>
  <rect width="1000" height="380" rx="18" fill="url(#dots)"/>
  <path d="M48 40h24" stroke="#8bdecf" stroke-width="3"/>
  <text x="86" y="45" font-size="13" letter-spacing="1.8" fill="#c1d7da">MORRIS JHENNONG CHEN</text>
  <text x="48" y="143" class="headline">Building practical solutions</text><text x="48" y="197" class="headline accent">to real-world problems.</text>
  <text x="48" y="238" font-size="18" fill="#a7bdc7">AI · Software Engineering · System Design</text>
  <g transform="translate(48 282)">
      <path d="M0 18H575" class="route"/><path d="M0 18H575" class="signal"/>
      <g class="pill"><rect width="156" height="38" rx="19"/><rect x="210" width="142" height="38" rx="19"/><rect x="408" width="166" height="38" rx="19"/></g>
      <g class="step" text-anchor="middle"><text x="78" y="24">01 / UNDERSTAND</text><text x="281" y="24">02 / DESIGN</text><text x="491" y="24">03 / BUILD</text></g>
    </g>
    <g transform="translate(794 82)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-32 15h36q16 0 16 16v32m-52 46H4q16 0 16-16V63m0 0h30q16 0 16 16v37h45" class="route"/>
      <path d="M-32 15h36q16 0 16 16v32h30q16 0 16 16v37h45" class="signal"/>
      <rect x="-70" y="-5" width="38" height="38" rx="10" class="node"/><path d="M-62 14h4l3-8 5 16 4-8h5" stroke="#7dd3c7" stroke-width="2"/>
      <rect x="-70" y="90" width="38" height="38" rx="10" class="node"/><path d="M-62 109s4-6 11-6 11 6 11 6-4 6-11 6-11-6-11-6Z" stroke="#7dd3c7" stroke-width="1.6"/><circle cx="-51" cy="109" r="2" stroke="#7dd3c7"/>
      <rect x="111" y="94" width="58" height="44" rx="10" class="node"/><path d="M122 107h36m-36 8h13m-13 8h24" stroke="#7dd3c7" stroke-width="2"/>
      <circle cx="20" cy="63" r="7" fill="#80d9c9" stroke="#b4f1e4"/>
    </g>
</svg>
